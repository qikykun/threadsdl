name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Buat proyek
        run: |
          mkdir -p app/src/main/java/com/pribadi/threadsdl
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "ThreadsDL"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.pribadi.threadsdl"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.pribadi.threadsdl"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Threads DL"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/pribadi/threadsdl/MainActivity.kt <<'EOF'
          package com.pribadi.threadsdl

          import android.app.Activity
          import android.app.DownloadManager
          import android.content.ClipboardManager
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : Activity() {
              private lateinit var input: EditText
              private lateinit var status: TextView
              private var lastLink = ""

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val pad = (24 * resources.displayMetrics.density).toInt()
                  input = EditText(this).apply { hint = "Link Threads"; setSingleLine() }
                  status = TextView(this).apply {
                      text = "Salin link Threads, lalu buka aplikasi ini."
                      setPadding(0, pad, 0, 0)
                  }
                  setContentView(LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, pad)
                      addView(input); addView(status)
                  })
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (!hasFocus) return
                  val cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                  val text = cm.primaryClip?.takeIf { it.itemCount > 0 }
                      ?.getItemAt(0)?.coerceToText(this)?.toString() ?: return
                  val link = Regex("https?://(www\\.)?threads\\.(net|com)/\\S+").find(text)?.value ?: return
                  if (link == lastLink) return
                  lastLink = link
                  input.setText(link)
                  fetchAndDownload(link)
              }

              private fun fetchAndDownload(link: String) {
                  say("Mengambil media...")
                  Thread {
                      try {
                          val c = URL(link).openConnection() as HttpURLConnection
                          c.setRequestProperty("User-Agent", "facebookexternalhit/1.1")
                          c.connectTimeout = 15000; c.readTimeout = 15000
                          val html = c.inputStream.bufferedReader().readText()
                          val videos = find(html, "\"video_versions\":\\[\\{[^\\]]*?\"url\":\"(.*?)\"") +
                                  find(html, "property=\"og:video\" content=\"(.*?)\"")
                          val images = find(html, "\"candidates\":\\[\\{[^\\]]*?\"url\":\"(.*?)\"") +
                                  find(html, "property=\"og:image\" content=\"(.*?)\"")
                          val files = if (videos.isNotEmpty()) videos.map { it to "mp4" }
                                      else images.map { it to "jpg" }
                          if (files.isEmpty()) { say("Tidak ada foto/video ditemukan."); return@Thread }
                          val dm = getSystemService(DOWNLOAD_SERVICE) as DownloadManager
                          val stamp = System.currentTimeMillis()
                          val uniq = files.distinctBy { it.first }
                          uniq.forEachIndexed { i, (url, ext) ->
                              dm.enqueue(DownloadManager.Request(Uri.parse(url))
                                  .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                                  .setDestinationInExternalPublicDir(
                                      Environment.DIRECTORY_DOWNLOADS, "Threads/threads_${stamp}_$i.$ext"))
                          }
                          say("Mengunduh ${uniq.size} file ke Downloads/Threads")
                      } catch (e: Exception) {
                          lastLink = ""
                          say("Gagal: ${e.message}")
                      }
                  }.start()
              }

              private fun find(html: String, pattern: String): List<String> =
                  Regex(pattern).findAll(html).map {
                      it.groupValues[1].replace("\\/", "/").replace("\\u0026", "&").replace("&amp;", "&")
                  }.toList()

              private fun say(s: String) = runOnUiThread { status.text = s }
          }
          EOF
      - name: Build
        run: gradle assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
